version: 2

# Minor and patch updates arrive grouped; every major update gets its own pull request so a
# breaking change is reviewed (and tested by CI) on its own.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    groups:
      webui-minor:
        update-types: [minor, patch]
    ignore:
      # Stock TypeScript 7 has no classic compiler API for vue-tsc and typescript-eslint;
      # the WebUI gets the TS 7 engine through typescript-native-bridge (see
      # ui/pnpm-workspace.yaml), which is bumped by hand with the tsgo version it wraps.
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
