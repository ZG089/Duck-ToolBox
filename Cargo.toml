[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/eltavine/Duck-ToolBox"
publish = false

[workspace.dependencies]
duck-core = { path = "crates/duck-core" }
duck-platform = { path = "crates/duck-platform" }
duck-rkp = { path = "crates/duck-rkp" }
duck-device-ids = { path = "crates/duck-device-ids" }
duck-tricky-store = { path = "crates/duck-tricky-store" }

aes = "0.9"
aes-gcm = "0.10.3"
anyhow = "1.0.102"
base64ct = { version = "1.8.3", features = ["alloc"] }
ciborium = "0.2.2"
clap = { version = "4.6.1", features = ["derive"] }
cmac = "0.8"
ed25519-dalek = "2.2.0"
getrandom = "0.4"
hex = "0.4.3"
hkdf = "0.13"
libloading = "0.9"
p256 = { version = "0.13.2", features = ["arithmetic", "ecdh", "ecdsa", "pem", "pkcs8"] }
p384 = { version = "0.13.1", features = ["ecdsa"] }
quick-xml = "0.40.1"
reqwest = { version = "0.13.3", default-features = false, features = ["http2", "rustls"] }
rustls = { version = "0.23.40", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
toml = "1.1.2"
webpki-roots = "1.0.7"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
x509-cert = "0.2.5"
zeroize = { version = "1.8.2", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
strip = true
